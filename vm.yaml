apiVersion: v1
kind: Secret
metadata:
  name: spire-vm-cloudinit
  namespace: default
type: Opaque
stringData:
  userdata: |
    #cloud-config
    hostname: spire-vm
    fqdn: spire-vm.example.test
    users:
      - name: cloud
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
    packages: [git, make, curl, golang-go]
    write_files:
      - path: /etc/spire/agent.conf
        permissions: "0600"
        content: |
          agent {
            data_dir          = "/var/lib/spire-agent"
            log_level         = "INFO"
            server_address    = "spire-server.spire-server.svc.cluster.local"
            server_port       = "443"
            socket_path       = "/run/spire/agent/sockets/main/public/api.sock"
            trust_domain      = "example.test"
            trust_bundle_path = "/etc/spire/bundle.pem"
            join_token        = "@JOIN_TOKEN@"
          }
          plugins {
            NodeAttestor "join_token" {
              plugin_data {}
            }
            KeyManager "disk" {
              plugin_data { directory = "/var/lib/spire-agent" }
            }
            WorkloadAttestor "unix" {
              plugin_data {}
            }
            WorkloadAttestor "systemd" {
            }
          }
      - path: /etc/systemd/system/spire-agent.service
        content: |
          [Unit]
          Description=SPIRE Agent
          After=network-online.target
          Wants=network-online.target
          [Service]
          ExecStart=/opt/spire/bin/spire-agent run -config /etc/spire/agent.conf
          Restart=always
          [Install]
          WantedBy=multi-user.target
      - path: /etc/spiffe/step-ssh/main.conf
        permissions: "0644"
        content: |
          SPIFFE_STEP_SSH_URL=https://spiffe-step-ssh.spiffe-step-ssh.svc.cluster.local
          SPIFFE_STEP_SSH_FETCHCA_URL=https://spiffe-step-ssh-fetchca.spiffe-step-ssh.svc.cluster.local
          SPIFFE_ENDPOINT_SOCKET=unix:///run/spire/agent/sockets/main/public/api.sock
      - path: /usr/local/sbin/enable-ssh-hostcert.sh
        permissions: "0755"
        content: |
          #!/bin/bash
          # Wait up to 15 min (emulated VMs are slow) for spiffe-step-ssh to issue the host cert.
          for i in $(seq 1 180); do
            cert=$(ls /var/run/spiffe/step-ssh/main/ssh_host_*_key-cert.pub 2>/dev/null | head -1)
            [ -n "$cert" ] && break
            sleep 5
          done
          if [ -z "$cert" ]; then
            echo "no host certificate found; leaving sshd unchanged"
            exit 0
          fi
          key=${cert%-cert.pub}
          printf 'HostKey %s\nHostCertificate %s\n' "$key" "$cert" > /etc/ssh/sshd_config.d/50-host-cert.conf
          if sshd -t; then
            systemctl reload ssh
            echo "sshd now presents $cert"
          else
            rm -f /etc/ssh/sshd_config.d/50-host-cert.conf
            echo "sshd -t failed; reverted"
          fi
    runcmd:
      # Bootstrap disk (bundle, join token, your public key)
      - |
        set -e
        mkdir -p /mnt/bootstrap /etc/spire /var/lib/spire-agent /opt/spire /etc/spiffe/step-ssh
        mount -o ro -L spire-bootstrap /mnt/bootstrap
        cp /mnt/bootstrap/bundle.pem /etc/spire/bundle.pem
        sed -i "s|@JOIN_TOKEN@|$(cat /mnt/bootstrap/join_token)|" /etc/spire/agent.conf
        install -d -m 700 -o cloud -g cloud /home/cloud/.ssh
        install -m 600 -o cloud -g cloud /mnt/bootstrap/authorized_keys /home/cloud/.ssh/authorized_keys
        umount /mnt/bootstrap
      # Binaries (amd64 or arm64)
      - |
        set -e
        ARCH=$(dpkg --print-architecture)
        V=1.11.0   # match your SPIRE server; check the exact release asset name
        curl -fsSL "https://github.com/spiffe/spire/releases/download/v${V}/spire-${V}-linux-${ARCH}-musl.tar.gz" \
          | tar -xz -C /opt/spire --strip-components=1
        curl -fsSLo /tmp/step.deb "https://dl.smallstep.com/cli/docs-cli-install/latest/step-cli_${ARCH}.deb"
        dpkg -i /tmp/step.deb
        git clone --depth 1 --branch v0.3.0 https://github.com/spiffe/spiffe-step-ssh /opt/spiffe-step-ssh
        make -C /opt/spiffe-step-ssh install
      # Spire helper
      - |
        set -e
        V=v0.11.0
        case "$(dpkg --print-architecture)" in
          amd64) ARCH_RE="amd64|x86_64" ;;
          arm64) ARCH_RE="arm64|aarch64" ;;
        esac
        URL=$(curl -fsSL https://api.github.com/repos/spiffe/spiffe-helper/releases/tags/$V \
          | grep browser_download_url | cut -d'"' -f4 \
          | grep -i linux | grep -iE "$ARCH_RE" | grep -viE 'sha|sig|\.txt|\.pem' | head -1)
        d=$(mktemp -d); curl -fsSL "$URL" -o "$d/asset"
        case "$URL" in
          *.tar.gz|*.tgz) tar -xzf "$d/asset" -C "$d" ;;
          *.zip)          apt-get install -y unzip && unzip -q "$d/asset" -d "$d" ;;
          *)              cp "$d/asset" "$d/spiffe-helper" ;;
        esac
        install -m 0755 "$(find "$d" -type f -name spiffe-helper | head -1)" /usr/local/bin/spiffe-helper
      - |
        tee /etc/spiffe/step-ssh/agent_address.hcl <<'EOF'

        agent_address = "/run/spire/agent/sockets/main/public/api.sock"
        EOF

        mkdir -p /etc/systemd/system/spiffe-step-ssh@.service.d
        tee /etc/systemd/system/spiffe-step-ssh@.service.d/agent-address.conf <<'EOF'
        [Service]
        ExecStartPre=/bin/bash -c "cat /etc/spiffe/step-ssh/agent_address.hcl >> /var/run/spiffe/step-ssh/%i/helper.conf"
        EOF
      - systemctl daemon-reload
      - systemctl enable --now spire-agent
      - systemctl enable --now spiffe-step-ssh@main || true
      - /usr/local/sbin/enable-ssh-hostcert.sh
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: spire-vm
  namespace: default
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: spire-vm-root
      spec:
        source:
          registry:
            url: docker://quay.io/containerdisks/ubuntu:22.04
        storage:
          resources:
            requests:
              storage: 20Gi
  template:
    metadata:
      labels:
        kubevirt.io/vm: spire-vm
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      architecture: amd64
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk: { bus: virtio }
            - name: cloudinit
              disk: { bus: virtio }
            - name: spire-bootstrap
              disk: { bus: virtio }
              serial: SPIREBOOT
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: spire-vm-root
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: spire-vm-cloudinit
        - name: spire-bootstrap
          secret:
            secretName: spire-vm-bootstrap
            volumeLabel: spire-bootstrap
