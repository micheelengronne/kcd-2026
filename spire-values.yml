---
global:
  openshift: true
  spire:
    #ingressControllerType: ingress-nginx
    clusterName: test-cluster
    trustDomain: example.test
    recommendations:
      enabled: true
    namespaces:
      create: true
      server:
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/warn: privileged
          pod-security.kubernetes.io/audit: privileged
    caSubject:
      country: KCD
      organization: Kcd Suisse Romande
      commonName: example.test
  spire-server:
    #ingress:
    #  enabled: true
    #nodeAttestor:
    #  httpChallenge:
    #    enabled: true
    controllerManager:
      identities:
        clusterSPIFFEIDs:
          spiffe-step-ssh-config:
            type: raw
            namespaceSelector:
              matchLabels:
                "kubernetes.io/metadata.name": default
            podSelector:
              matchLabels:
                app: spiffe-step-ssh
                component: config
          spiffe-step-ssh-fetchca:
            type: raw
            namespaceSelector:
              matchLabels:
                "kubernetes.io/metadata.name": default
            podSelector:
              matchLabels:
                app: spiffe-step-ssh
                component: fetchca
            dnsNameTemplates:
            - "spiffe-step-ssh-fetchca.spire-server.svc.cluster.local"
