---
global:
  openshift: true
  spire:
    clusterName: test-cluster
    trustDomain: example.test
    recommendations:
      enabled: true
    namespaces:
      create: true
      server:
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/warn: privileged
          pod-security.kubernetes.io/audit: privileged
    caSubject:
      country: KCD
      organization: Kcd Suisse Romande
      commonName: example.test
spire-server:
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        spiffe-step-ssh-config:
          type: raw
          namespaceSelector:
            matchLabels:
              "kubernetes.io/metadata.name": spiffe-step-ssh
          podSelector:
            matchLabels:
              app: spiffe-step-ssh
              component: config
        spiffe-step-ssh-fetchca:
          type: raw
          namespaceSelector:
            matchLabels:
              "kubernetes.io/metadata.name": spiffe-step-ssh
          podSelector:
            matchLabels:
              app: spiffe-step-ssh
              component: fetchca
          dnsNameTemplates:
          - "spiffe-step-ssh-fetchca.{{ .TrustDomain }}"
          - "spiffe-step-ssh-fetchca.spiffe-step-ssh.svc.cluster.local"
