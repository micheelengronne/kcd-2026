---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
  - vm.yaml          # the Secret (cloud-init) + VirtualMachine

secretGenerator:
  - name: spire-vm-bootstrap
    files:
      - bundle.pem   # local file next to this kustomization
      - join_token
      - authorized_keys=./id_ed25519.pub

generatorOptions:
  disableNameSuffixHash: true
